{% extends "base.html" %}
{% block title %}Reset Your Password{% endblock %}
{% block content %}
<h2>Reset Password</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post" action="{% url 'grabsomore:reset_password' %}">
        {% csrf_token %}
        <label for="password">New password</label><input id="password" autocomplete="new-password" type="password" name="password" placeholder="New password" required><br><br>
        <label for="password_conf">Confirm password</label><input id="password_conf" autocomplete="new-password" type="password" name="password_conf" placeholder="Confirm new password" required><br><br>
        <button type="submit">Reset Password</button>
  </form>
{% endblock %}
