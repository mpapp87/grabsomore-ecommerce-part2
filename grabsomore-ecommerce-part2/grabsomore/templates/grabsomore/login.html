{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>


    <form method="POST" action="{% url 'grabsomore:login' %}">
        {% csrf_token %}


        <label for="username">Username:</label>
        <input type="text" id="username" name="username" autocomplete="username" required><br><br>


        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required><br><br>


        <button type="submit">Login</button>
    </form>


    {% if error %}
        <p>{{ error }}</p>
    {% endif %}


    <p>
        <a href="{% url 'grabsomore:request_password_reset' %}">Forgot your password?</a>
    </p>


    <div>
        <p>Don't have an account?
            <a href="{% url 'grabsomore:register' %}">Register here</a>
        </p>
    </div>
{% endblock %}
