{% if page.has_other_pages %}<nav class="actions" aria-label="Page navigation">
{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;store={{ selected_store|urlencode }}">Previous</a>{% endif %}
<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;store={{ selected_store|urlencode }}">Next</a>{% endif %}
</nav>{% endif %}
