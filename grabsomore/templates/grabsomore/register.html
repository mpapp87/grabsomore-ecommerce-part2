{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register an account</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{% url 'grabsomore:register' %}">
    {% csrf_token %}
    <label for="username">Username</label>
    <input id="username" type="text" name="username" value="{{ username|default:'' }}" required maxlength="150" autocomplete="username"><br><br>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email|default:'' }}" required autocomplete="email"><br><br>
    <label for="role">Account type</label>
    <select id="role" name="role" required>
        <option value="">Choose account type</option>
        <option value="buyer" {% if selected_role == 'buyer' %}selected{% endif %}>Buyer</option>
        <option value="vendor" {% if selected_role == 'vendor' %}selected{% endif %}>Vendor</option>
    </select><br><br>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required autocomplete="new-password"><br><br>
    <label for="password_conf">Confirm password</label>
    <input id="password_conf" type="password" name="password_conf" required autocomplete="new-password"><br><br>
    <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{% url 'grabsomore:login' %}">Log in</a></p>
{% endblock %}
